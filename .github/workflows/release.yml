# Each push to main: the host tests, then a release of the example firmwares
# built against the sibling commits deps.lock pins (scripts/pin.sh)
# (examples/idf/minimal, and examples/idf/full's profiles: full, classic for
# the classic ESP32 with its Gledopto Ethernet variant, and psram for the
# ESP32-S3; firmware.github() points here, at the asset named as the build)
# under the next patch version, or library.json's version when it was raised
# above it, and TesserUI's launcher on GitHub Pages
# (https://leokeba.github.io/TesserKIT/), built from the same TesserUI as the
# firmware, with the latest three releases' factory images to install. The
# Arduino examples are built beside them. A commit message with "[skip ci]"
# releases nothing.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time, so two pushes never take the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: library.json and the workflows pin what deps.lock pins
        run: scripts/pin.sh --check
      # TesserAPI fetched at deps.lock's commit.
      - name: Build and run tests (ASan + UBSan)
        run: |
          cmake -S . -B build
          cmake --build build -j
          ctest --test-dir build --output-on-failure

  # The Arduino examples, built with Arduino-ESP32 against the sibling
  # commits deps.lock pins, as PlatformIO and Arduino users get them through
  # library.json. Not a gate for the release: a red job here says Arduino
  # broke, the ESP-IDF images still go out. min_spiffs: every first-release
  # service is past the default 1.25 MB slot (DESIGN.md section 11);
  # Bluetooth on the C3 and the S3 only, since Arduino's Bluedroid doesn't
  # fit a classic ESP32's slot beside the rest.
  arduino:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {chip: esp32, sketches: "[examples/arduino/Minimal]"}
          - {chip: esp32c3, sketches: "[examples/arduino/Minimal, examples/arduino/Bluetooth]"}
          - {chip: esp32s3, sketches: "[examples/arduino/Minimal, examples/arduino/Bluetooth]"}
    steps:
      - uses: actions/checkout@v5
      - name: The pinned siblings
        id: deps
        run: |
          while IFS=@ read -r repo sha; do
            echo "$(basename "$repo")=$sha" >> "$GITHUB_OUTPUT"
          done < <(grep -v '^#' deps.lock | grep @)
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:${{ matrix.chip }}:PartitionScheme=min_spiffs
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
              version: 3.3.7
          sketch-paths: ${{ matrix.sketches }}
          libraries: |
            - source-path: ./
            - source-url: https://github.com/leokeba/TesserAPI.git
              version: ${{ steps.deps.outputs.TesserAPI }}
            - source-url: https://github.com/leokeba/TesserUI.git
              version: ${{ steps.deps.outputs.TesserUI }}
            - source-url: https://github.com/leokeba/NowTP.git
              version: ${{ steps.deps.outputs.NowTP }}
            - name: ArduinoJson
          enable-deltas-report: false

  firmware:
    needs: host-tests
    permissions:
      contents: write
    uses: ./.github/workflows/firmware.yml
    with:
      projects: |
        [{"project": "examples/idf/minimal", "name": "tesserkit-minimal", "build-args": "-DWITH_GITHUB=1"},
         {"project": "examples/idf/full", "name": "tesserkit-full"},
         {"project": "examples/idf/full", "name": "tesserkit-classic", "build-args": "-DPROFILE=classic", "targets": ["esp32"]},
         {"project": "examples/idf/full", "name": "tesserkit-classic-gledopto",
          "build-args": "-DPROFILE=classic -DETHERNET_BOARD=gledopto", "targets": ["esp32"]},
         {"project": "examples/idf/full", "name": "tesserkit-psram", "build-args": "-DPROFILE=psram", "targets": ["esp32s3"]}]
      targets: '["esp32", "esp32c3", "esp32s3"]'
      # TesserKIT's own images on ESP-IDF 6.1 (2026-10-24, Leo); the
      # workflow's default stays 5.5 for applications, whose code may use
      # drivers 6.0 removed, until each moves.
      idf-version: release-v6.1
      version-command: jq -r .version library.json
      # The tag's library.json, library.properties and idf_component.yml say
      # its version (DESIGN.md section 13).
      stamp-command: python3 scripts/version.py "$VERSION"
      dependencies-file: deps.lock
      # Room for the next update in the 1.75 MB slot of the files table (3 MB
      # in the psram profile's 8 MB table).
      min-free: 16384

  # TesserUI's bridge as a macOS executable for each architecture
  # (tesserkit-bridge-macos-arm64.zip, -x64.zip), attached to the release: it
  # finds the devices nearby and serves this launcher from localhost, with
  # the flasher built in and the releases' images fetched from GitHub
  # (TesserUI's DESIGN.md section 9.7). The launcher links to the latest
  # release's, so they are missing there until this job is done. The workflow
  # is TesserUI's at deps.lock's commit: scripts/pin.sh updates the ref below,
  # and its --check (host-tests) fails when they differ.
  bridge:
    needs: firmware
    permissions:
      contents: write
    uses: leokeba/TesserUI/.github/workflows/bridge.yml@a08af930d4e612a898ff3d3c0e805d3a3581cf1f
    with:
      page: pages/index.html
      name: tesserkit-bridge
      tag: v${{ needs.firmware.outputs.version }}
      tesserui-ref: ${{ fromJSON(needs.firmware.outputs.dependencies)['leokeba/TesserUI'] }}

  # The launcher (TesserUI's DESIGN.md section 9.7): devices reached over USB,
  # Bluetooth or the network, with no interface of their own needed, and
  # firmware installed over USB (section 9.7.1). After the release, which it
  # offers; deployed even when the release failed, with the releases there are.
  pages:
    needs: [host-tests, firmware]
    if: ${{ !cancelled() && needs.host-tests.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - id: pins
        run: echo "tesserui=$(sed -n 's|^leokeba/TesserUI@||p' deps.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: leokeba/TesserUI
          ref: ${{ steps.pins.outputs.tesserui }}
          path: TesserUI
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: TesserUI/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: TesserUI/web/pnpm-lock.yaml
      - name: Build the bundle
        working-directory: TesserUI/web
        run: pnpm install --frozen-lockfile && pnpm build
      # ui.js loads the launcher's workspace (several nodes at once) from
      # launcher.js beside it, and the widgets few pages use from ui/.
      - name: Site
        run: mkdir _site && cp pages/index.html TesserUI/web/dist/ui.js TesserUI/web/dist/launcher.js _site/ && cp -R TesserUI/web/dist/flash _site/flash && cp -R TesserUI/web/dist/ui _site/ui
      # A page can't read release assets from GitHub (no CORS): the flasher
      # finds them next to it.
      - name: The firmware the launcher installs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node TesserUI/web/scripts/firmware.mjs "$GITHUB_REPOSITORY" _site/firmware --releases 3
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
