# Each push to main: the host tests, then a release of the example firmware
# (examples/idf/minimal, with firmware.github() pointing here) under the next
# patch version, or library.json's version when it was raised above it, and
# TesserUI's launcher on GitHub Pages (https://leokeba.github.io/TesserKIT/),
# built from the same TesserUI as the firmware. A commit message with
# "[skip ci]" releases nothing.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time, so two pushes never take the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and run tests (ASan + UBSan)
        run: |
          cmake -S . -B build
          cmake --build build -j
          ctest --test-dir build --output-on-failure

  firmware:
    needs: host-tests
    permissions:
      contents: write
    uses: ./.github/workflows/firmware.yml
    with:
      project: examples/idf/minimal
      name: tesserkit-minimal
      targets: '["esp32", "esp32c3", "esp32s3"]'
      build-args: -DWITH_GITHUB=1
      version-command: jq -r .version library.json
      dependencies: |
        leokeba/TesserAPI
        leokeba/TesserUI

  # The launcher (TesserUI's DESIGN.md section 9.7): devices reached over USB,
  # Bluetooth or the network, with no interface of their own needed.
  pages:
    needs: host-tests
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: leokeba/TesserUI
          path: TesserUI
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: TesserUI/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: TesserUI/web/pnpm-lock.yaml
      - name: Build the bundle
        working-directory: TesserUI/web
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Site
        run: mkdir _site && cp pages/index.html TesserUI/web/dist/ui.js _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
