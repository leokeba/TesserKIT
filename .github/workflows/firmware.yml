# Builds an ESP-IDF firmware for each target and publishes it as a GitHub
# release under the next version: what Firmware::github() installs from
# (docs/DESIGN.md section 5.4). TesserKIT's release.yml calls it for its
# example; applications call it the same way:
#
#   jobs:
#     firmware:
#       permissions:
#         contents: write
#       uses: leokeba/TesserKIT/.github/workflows/firmware.yml@main
#       with:
#         project: firmware
#         name: heliostat
#
# The version is the last tag's (vX.Y.Z) with the patch raised, or its minor
# or major when a commit since that tag has a "Release: minor" or
# "Release: major" trailer in its message (the largest wins; one in a push
# whose CI failed still counts at the next release), or what
# `version-command` prints when that is higher (a first release, a jump).
# `stamp-command` writes the version (in VERSION) into the repository's version
# files: the job commits that on top of the pushed commit, as the bot, and the
# tag points at that commit, so a tag's files state its version while the
# branch never gets a commit from the bot. The images are built from the
# pushed commit, with PROJECT_VER. A rerun on a released commit keeps its
# version (its tag is on it or on its release commit). A run whose commit is
# no longer the branch's head by the time the images are built releases
# nothing: the newer run releases its own commit. Without `project` or
# `projects`, the release has no images: a library's, with the same version,
# stamp, tag and notes.
# Each target gives <name>-<target>.bin, the image devices install,
# <name>-<target>-factory.bin, the whole flash for a new board (0x0), and
# <name>-<target>.elf, the image's symbols, which decode a core dump of it
# (a rebuild gives another ELF: paths and dates differ).
# Several firmwares go in one release with `projects` instead of `project`,
# `name` and `build-args`, each for `targets` or for its own:
#
#       projects: |
#         [{"project": "firmware", "name": "heliostat"},
#          {"project": "gateway", "name": "gateway", "build-args": "-DUSB=1", "targets": ["esp32"]}]
name: Firmware release

on:
  workflow_call:
    inputs:
      project:
        description: The ESP-IDF project's directory in the repository
        type: string
        default: ''
      name:
        description: The assets' names begin with it
        type: string
        default: ''
      projects:
        description: 'Several firmwares, as a JSON list of {"project", "name", "build-args", "targets"}, instead of project, name and build-args; "targets" (a JSON list) replaces the targets input for that firmware. None of them: a release without images (a library)'
        type: string
        default: ''
      targets:
        description: The chips, as a JSON list
        type: string
        default: '["esp32"]'
      idf-version:
        description: The espressif/idf image's tag
        type: string
        default: release-v5.5
      build-args:
        description: More idf.py arguments (-DOPTION=1 ...)
        type: string
        default: ''
      version-command:
        description: Prints the lowest version to release (jq -r .version library.json), for a first release or a jump
        type: string
        default: ''
      stamp-command:
        description: Writes the version (in VERSION) into the version files; the release commit on top of the pushed one, which the tag points at
        type: string
        default: ''
      dependencies:
        description: Repositories checked out next to this one, one per line (owner/repo or owner/repo@ref)
        type: string
        default: ''
      dependencies-file:
        description: A file in the repository listing more of them the same way (deps.lock), '#' starting a comment
        type: string
        default: ''
      min-free:
        description: Bytes an image must leave free in its app partition, or the release fails (0 checks nothing)
        type: number
        default: 0
    outputs:
      version:
        description: The version released
        value: ${{ jobs.version.outputs.version }}
      dependencies:
        description: 'The commits the dependencies were built at, as a JSON object {"owner/repo": "sha"}'
        value: ${{ jobs.version.outputs.dependencies }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      firmware: ${{ steps.firmware.outputs.firmware }}
      dependencies: ${{ steps.dependencies.outputs.dependencies }}
      checkouts: ${{ steps.dependencies.outputs.checkouts }}
    steps:
      - id: firmware
        env:
          PROJECTS: ${{ inputs.projects }}
          PROJECT: ${{ inputs.project }}
          NAME: ${{ inputs.name }}
          BUILD_ARGS: ${{ inputs.build-args }}
          TARGETS: ${{ inputs.targets }}
        run: |
          if [ -z "$PROJECTS" ] && [ -z "$PROJECT" ] && [ -z "$NAME" ]; then
            # A library's release: the version, the tag and the notes.
            echo "firmware=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$PROJECTS" ]; then
            if [ -z "$PROJECT" ] || [ -z "$NAME" ]; then
              echo "::error::give project and name, or projects"
              exit 1
            fi
            PROJECTS=$(jq -cn --arg p "$PROJECT" --arg n "$NAME" --arg a "$BUILD_ARGS" \
              '[{project: $p, name: $n, "build-args": $a}]')
          fi
          if ! jq -e 'type == "array" and length > 0 and all(.[]; (.project | type) == "string" and (.name | type) == "string"
                and ((.targets // ["x"]) | type == "array" and length > 0 and all(.[]; type == "string")))' \
            <<< "$PROJECTS" > /dev/null; then
            echo "::error::projects must be a JSON list of {\"project\", \"name\", \"build-args\", \"targets\"}"
            exit 1
          fi
          # One build per firmware and target, for the matrix.
          echo "firmware=$(jq -c --argjson targets "$TARGETS" '[.[] | . as $f | ($f.targets // $targets)[]
            | {project: $f.project, name: $f.name, "build-args": ($f["build-args"] // ""), target: .}]' <<< "$PROJECTS")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: next
        env:
          VERSION_COMMAND: ${{ inputs.version-command }}
        run: |
          semver='^[0-9]+\.[0-9]+\.[0-9]+$'
          highest() { sed 's/^v//' | { grep -E "$semver" || true; } | sort -V | tail -1; }
          # A rerun keeps the version of a released commit: its tag is on the
          # commit itself (no stamp-command), or on the release commit
          # stamped on top of it.
          head=$(git rev-parse HEAD)
          next=$(git for-each-ref --format='%(refname:short) %(*objectname)%(objectname)' 'refs/tags/v*' |
            while read -r tag commit; do
              commit=${commit:0:40}
              if [ "$commit" = "$head" ] || [ "$(git rev-parse -q --verify "$commit^1" 2>/dev/null)" = "$head" ]; then
                echo "$tag"
              fi
            done | highest)
          if [ -z "$next" ]; then
            last=$(git tag --list 'v*' | highest)
            if [ -n "$last" ]; then
              # Patch by default; a "Release: minor" or "Release: major"
              # trailer in any commit since the last tag raises it (the
              # largest wins), so one in a push whose CI failed still counts.
              bump=patch
              for kind in $(git log "v$last..HEAD" --format='%(trailers:key=Release,valueonly)' | tr 'A-Z' 'a-z'); do
                case "$kind" in
                  major) bump=major ;;
                  minor) [ "$bump" = major ] || bump=minor ;;
                  patch) ;;
                  *) echo "::warning::unknown Release trailer '$kind' (major, minor or patch): taken as patch" ;;
                esac
              done
              IFS=. read -r major minor patch <<< "$last"
              case "$bump" in
                major) next="$((major + 1)).0.0" ;;
                minor) next="$major.$((minor + 1)).0" ;;
                *) next="$major.$minor.$((patch + 1))" ;;
              esac
            else
              next=0.1.0
            fi
            if [ -n "$VERSION_COMMAND" ]; then
              floor=$(bash -c "$VERSION_COMMAND")
              if ! grep -qE "$semver" <<< "$floor"; then
                echo "::error::version-command printed '$floor', not X.Y.Z"
                exit 1
              fi
              [ "$(printf '%s\n%s\n' "$next" "$floor" | sort -V | tail -1)" = "$floor" ] && next=$floor
            fi
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Releasing v$next" >> "$GITHUB_STEP_SUMMARY"
      # Each dependency's ref resolved to a commit once, here: every build
      # uses the same ones, and the release notes name them.
      - id: dependencies
        env:
          DEPENDENCIES: ${{ inputs.dependencies }}
          DEPENDENCIES_FILE: ${{ inputs.dependencies-file }}
        run: |
          list=$DEPENDENCIES
          if [ -n "$DEPENDENCIES_FILE" ]; then
            list="$list $(sed 's/#.*//' "$DEPENDENCIES_FILE")"
          fi
          json='{}'
          checkouts=''
          for dep in $list; do
            repo=${dep%@*}
            ref=main
            [ "$repo" != "$dep" ] && ref=${dep#*@}
            if grep -qE '^[0-9a-f]{40}$' <<< "$ref"; then
              sha=$ref
            else
              # An annotated tag's commit is its peeled line (^{}), sorted last.
              sha=$(git ls-remote "https://github.com/$repo" "$ref" "$ref^{}" | sort -k2 | tail -1 | cut -f1)
              if [ -z "$sha" ]; then
                echo "::error::$repo has no branch or tag $ref (give a commit as its 40 characters)"
                exit 1
              fi
            fi
            json=$(jq -c --arg r "$repo" --arg s "$sha" '. + {($r): $s}' <<< "$json")
            checkouts="$checkouts $repo@$sha"
            echo "- $repo [${sha:0:7}](https://github.com/$repo/commit/$sha) ($ref)" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "dependencies=$json" >> "$GITHUB_OUTPUT"
          # The same as owner/repo@sha words, for the build's container,
          # which has no jq.
          echo "checkouts=${checkouts# }" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.firmware != '[]'
    runs-on: ubuntu-latest
    container: espressif/idf:${{ inputs.idf-version }}
    strategy:
      matrix:
        include: ${{ fromJSON(needs.version.outputs.firmware) }}
    defaults:
      run:
        shell: bash
    steps:
      # The workspace belongs to the runner's user, not the container's.
      - run: git config --global --add safe.directory '*'
      # The repository and its dependencies side by side, as on a
      # developer's machine.
      - uses: actions/checkout@v5
        with:
          path: ${{ github.event.repository.name }}
      - name: Check out the dependencies
        if: needs.version.outputs.checkouts != ''
        env:
          CHECKOUTS: ${{ needs.version.outputs.checkouts }}
        run: |
          for dep in $CHECKOUTS; do
            repo=${dep%@*}
            sha=${dep#*@}
            dir=${repo#*/}
            git init -q "$dir"
            git -C "$dir" fetch -q --depth 1 "https://github.com/$repo" "$sha"
            git -C "$dir" checkout -q FETCH_HEAD
            echo "$repo $(git -C "$dir" rev-parse --short HEAD)"
          done
      - name: Build
        working-directory: ${{ github.event.repository.name }}/${{ matrix.project }}
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
          NAME: ${{ matrix.name }}
          BUILD_ARGS: ${{ matrix.build-args }}
          MIN_FREE: ${{ inputs.min-free }}
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          # BUILD_ARGS is split into words on purpose.
          set -o pipefail
          idf.py -B build -DPROJECT_VER="$VERSION" $BUILD_ARGS set-target "$TARGET" build 2>&1 | tee build.log
          # Room left in the app partition: the next update must fit it.
          # ESP-IDF's size line is the only source: if a new ESP-IDF words
          # it otherwise, the gate fails rather than passing everything.
          sizes=$(grep -oE 'binary size 0x[0-9a-f]+ bytes. Smallest app partition is 0x[0-9a-f]+ bytes' build.log | tail -1 | grep -oE '0x[0-9a-f]+' | tr '\n' ' ' || true)
          if [ -z "$sizes" ]; then
            if [ "$MIN_FREE" -gt 0 ]; then
              echo "::error::$NAME-$TARGET: no size line in ESP-IDF's output, so min-free ($MIN_FREE) can't be checked"
              exit 1
            fi
            echo "::warning::$NAME-$TARGET: no size line in ESP-IDF's output: the room left in its slot is unknown"
          else
            read -r size slot <<< "$sizes"
            size=$((size)); slot=$((slot)); free=$((slot - size))
            echo "$NAME-$TARGET: $size bytes, $((free / 1024)) KB of the $((slot / 1024)) KB slot free" >> "$GITHUB_STEP_SUMMARY"
            if [ "$free" -lt "$MIN_FREE" ]; then
              echo "::error::$NAME-$TARGET leaves $free bytes free in its slot, under min-free ($MIN_FREE)"
              exit 1
            elif [ $((free * 20)) -lt "$slot" ]; then
              echo "::warning::$NAME-$TARGET leaves $((free / 1024)) KB free in its slot (under 5%)"
            fi
          fi
          cd build
          field() { python -c "import json; print(json.load(open('project_description.json'))['$1'])"; }
          built=$(field project_version)
          if [ "$built" != "$VERSION" ]; then
            echo "::error::the image says $built, not $VERSION (CONFIG_APP_PROJECT_VER_FROM_CONFIG?)"
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$(field app_bin)" "$GITHUB_WORKSPACE/dist/$NAME-$TARGET.bin"
          cp "$(field app_elf)" "$GITHUB_WORKSPACE/dist/$NAME-$TARGET.elf"
          python -m esptool --chip "$TARGET" merge_bin -o "$GITHUB_WORKSPACE/dist/$NAME-$TARGET-factory.bin" @flash_args
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.name }}-${{ matrix.target }}
          path: |
            dist/*.bin
            dist/*.elf
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [version, build]
    # Also without images (a library's release: build skipped).
    if: ${{ !cancelled() && needs.version.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        if: needs.version.outputs.firmware != '[]'
        with:
          pattern: firmware-*
          merge-multiple: true
          path: ${{ runner.temp }}/dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: v${{ needs.version.outputs.version }}
          DEPENDENCIES: ${{ needs.version.outputs.dependencies }}
          STAMP_COMMAND: ${{ inputs.stamp-command }}
          DIST: ${{ runner.temp }}/dist
        run: |
          shopt -s nullglob
          assets=("$DIST"/*.bin "$DIST"/*.elf)
          # The dependencies' commits, before GitHub's generated notes.
          NOTES=""
          if [ "$DEPENDENCIES" != '{}' ]; then
            NOTES=$(jq -r '"Built with:\n" + (to_entries | map("- \(.key) [`\(.value[0:7])`](https://github.com/\(.key)/commit/\(.value))") | join("\n"))' <<< "$DEPENDENCIES")
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # A rerun of a released commit: its images replaced.
            [ ${#assets[@]} -eq 0 ] || gh release upload "$TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            exit 0
          fi
          if [ -z "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
            # A push during the build moved the branch on: the newer run
            # releases. The tag couldn't be made anyway if that push changed a
            # workflow file, since the token may not create a ref whose
            # workflows differ from the branch's (403 "Resource not
            # accessible by integration").
            head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)
            if [ "$head" != "$GITHUB_SHA" ]; then
              echo "::notice::$GITHUB_REF_NAME moved on to ${head:0:7}: its own run releases, not $TAG for ${GITHUB_SHA:0:7}"
              exit 0
            fi
            # The version files state the release's version at its tag, in a
            # commit on top of the pushed one that only the tag points at:
            # the branch gets no commits from the bot (sessions push to it).
            # The images are built from the pushed commit (PROJECT_VER).
            git checkout -q --detach "$GITHUB_SHA"
            if [ -n "$STAMP_COMMAND" ]; then
              bash -c "$STAMP_COMMAND"
              if [ -n "$(git status --porcelain)" ]; then
                git config user.name "github-actions[bot]"
                git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
                git add -A
                git commit -q -m "Release $TAG" -m "The version files of $TAG, stamped on ${GITHUB_SHA:0:7}."
              fi
            fi
            git tag "$TAG"
            git push -q origin "refs/tags/$TAG"
            echo "$TAG: $(git rev-parse --short HEAD) (pushed ${GITHUB_SHA:0:7})" >> "$GITHUB_STEP_SUMMARY"
          fi
          gh release create "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" --notes "$NOTES" --generate-notes
