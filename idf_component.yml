version: "0.1.0"
description: "A device framework for ESP32: network setup, time, firmware updates, backups and system status as TesserAPI subtrees, drawn by TesserUI"
url: "https://github.com/leokeba/TesserKIT"
license: "MIT"
# TesserAPI and TesserUI are required but not listed: add them to the project
# (EXTRA_COMPONENT_DIRS or dependencies of your main component).
# CMakeLists.txt finds them under any component name ending in "tesserapi"
# and "tesserui".
dependencies:
  idf:
    version: ">=5.1"
  espressif/mdns:
    version: "^1.4.0"
  # Part of ESP-IDF until 6.0. Linked only by applications using Mqtt.
  espressif/mqtt:
    version: "^1.0.0"
    rules:
      - if: "idf_version >=6.0"
  # W5500 Ethernet modules on SPI, for chips without the internal MAC: part
  # of ESP-IDF (CONFIG_ETH_SPI_ETHERNET_W5500) until 6.0. Linked only by
  # applications declaring such a board (Network::ethernet()).
  espressif/w5500:
    version: "^2.0.1"
    rules:
      - if: "idf_version >=6.0"
      - if: "target not in [esp32, esp32p4]"
  # LittleFS, for the Files service. Linked only by applications using it.
  joltwallet/littlefs:
    version: "^1.20.0"
files:
  exclude:
    - "test/**/*"
    - "build/**/*"
    - ".github/**/*"
    - "fixtures/**/*"
    - "docs/**/*"
