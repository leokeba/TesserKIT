name=TesserKIT
version=0.1.0
author=Leo Baque
maintainer=Leo Baque
sentence=A device framework for ESP32 on TesserAPI and TesserUI.
paragraph=Wi-Fi with an access point and a captive portal, mDNS, time with SNTP and time zones, firmware updates by upload or from a URL with rollback, settings backups and system status: each a subtree of a TesserAPI tree, reachable over HTTP, WebSocket and serial, and drawn by TesserUI's web interface without UI code. Settings live in NVS.
category=Communication
