name=TesserKIT
version=0.3.3
author=Leo Baque
maintainer=Leo Baque
sentence=A device framework for ESP32 on TesserAPI and TesserUI.
paragraph=Wi-Fi with an access point and a captive portal, Ethernet, mDNS, time with SNTP and time zones, firmware updates by upload, URL or GitHub release with rollback, settings backups, files, timers, a sequencer, accounts, MQTT with Home Assistant discovery, Art-Net, Bluetooth, ESP-NOW, the log, the battery, deep sleep and system status: each a subtree of a TesserAPI tree, reachable over HTTP, WebSocket, serial, Bluetooth and ESP-NOW, and drawn by TesserUI's web interface without UI code. Settings live in NVS.
category=Communication
url=https://github.com/leokeba/TesserKIT
architectures=esp32
includes=TesserKIT.h
depends=TesserAPI,TesserUI
