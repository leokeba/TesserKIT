<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Reach a TesserKIT device over USB, Bluetooth or the network, or install one on a board: TesserUI's launcher." />
    <title>TesserKIT</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M4 4h24v24H4zm7 7v10h10V11zL4 4m24 0-7 7m0 10 7 7M4 28l7-7M16 0v4m0 24v4M0 16h4m24 0h4' fill='none' stroke='%232f5bd3' stroke-width='4'/></svg>" />
  </head>
  <body>
    <!-- TesserUI's bundle, published by .github/workflows/release.yml with the
         firmware it serves. A launcher: it opens ?api=, or the device the user
         picks (TesserUI's DESIGN.md section 9.7). It installs the examples'
         latest releases over USB, which the workflow copies next to it, then
         sets up the device's Wi-Fi (section 9.7.1). -->
    <script>
      window.TESSER = {
        launcher: true,
        title: 'TesserKIT',
        firmware: {
          images: [
            {
              label: 'Full',
              asset: 'tesserkit-full-{target}-factory.bin',
              description: 'Every service and transport: a starting point to strip down. Bluetooth is left out on the ESP32-C3.',
            },
            {
              label: 'Classic',
              asset: 'tesserkit-classic-{target}-factory.bin',
              description: 'Every service but Bluetooth, for a classic ESP32 without PSRAM: the memory a gateway, HTTPS and backups need.',
            },
            {
              label: 'Classic, Gledopto Ethernet',
              asset: 'tesserkit-classic-gledopto-{target}-factory.bin',
              description: 'The classic firmware with the Ethernet of Gledopto controllers (LAN8720), preferred to Wi-Fi while it has an address.',
            },
            {
              label: 'PSRAM (ESP32-S3, 8 MB)',
              asset: 'tesserkit-psram-{target}-factory.bin',
              description: 'Every service, for an ESP32-S3 with 8 MB of flash and octal PSRAM (N8R8): large buffers in PSRAM, 3 MB firmware slots.',
            },
            {
              label: 'Minimal',
              asset: 'tesserkit-minimal-{target}-factory.bin',
              description: 'Wi-Fi, time, firmware updates from these releases, backups, timers and accounts.',
            },
          ],
          wifi: '/sys/network/wifi',
        },
        // A node still open (no admin account, /sys/auth/open) is offered a
        // first admin account, which turns on its secure mode (TesserKIT's
        // DESIGN.md section 7). "Not now" is remembered per node.
        claim: '/sys/auth',
        // Nearby links to the bridge's executables on this repository's
        // latest release (release.yml's bridge job).
        bridge: { repo: 'leokeba/TesserKIT', name: 'tesserkit-bridge' },
      };
    </script>
    <script src="ui.js"></script>
  </body>
</html>
