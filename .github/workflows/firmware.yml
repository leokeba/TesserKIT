# Builds an ESP-IDF firmware for each target and publishes it as a GitHub
# release under the next version: what Firmware::github() installs from
# (docs/DESIGN.md section 5.4). TesserKIT's release.yml calls it for its
# example; applications call it the same way:
#
#   jobs:
#     firmware:
#       permissions:
#         contents: write
#       uses: leokeba/TesserKIT/.github/workflows/firmware.yml@main
#       with:
#         project: firmware
#         name: heliostat
#
# The version is the last tag's (vX.Y.Z) with the patch raised, or what
# `version-command` prints when that is higher, so a minor or major release is
# a commit raising that version. A rerun on a released commit keeps its
# version. A run whose commit is no longer the branch's head by the time the
# images are built releases nothing: the newer run releases its own commit.
# Each target gives <name>-<target>.bin, the image devices install,
# and <name>-<target>-factory.bin, the whole flash for a new board (0x0).
# Several firmwares go in one release with `projects` instead of `project`,
# `name` and `build-args`:
#
#       projects: |
#         [{"project": "firmware", "name": "heliostat"},
#          {"project": "gateway", "name": "gateway", "build-args": "-DUSB=1"}]
name: Firmware release

on:
  workflow_call:
    inputs:
      project:
        description: The ESP-IDF project's directory in the repository
        type: string
        default: ''
      name:
        description: The assets' names begin with it
        type: string
        default: ''
      projects:
        description: 'Several firmwares, as a JSON list of {"project", "name", "build-args"}, instead of project, name and build-args'
        type: string
        default: ''
      targets:
        description: The chips, as a JSON list
        type: string
        default: '["esp32"]'
      idf-version:
        description: The espressif/idf image's tag
        type: string
        default: release-v5.5
      build-args:
        description: More idf.py arguments (-DOPTION=1 ...)
        type: string
        default: ''
      version-command:
        description: Prints the lowest version to release (jq -r .version library.json)
        type: string
        default: ''
      dependencies:
        description: Repositories checked out next to this one, one per line (owner/repo or owner/repo@ref)
        type: string
        default: ''
    outputs:
      version:
        description: The version released
        value: ${{ jobs.version.outputs.version }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      firmware: ${{ steps.firmware.outputs.firmware }}
    steps:
      - id: firmware
        env:
          PROJECTS: ${{ inputs.projects }}
          PROJECT: ${{ inputs.project }}
          NAME: ${{ inputs.name }}
          BUILD_ARGS: ${{ inputs.build-args }}
        run: |
          if [ -z "$PROJECTS" ]; then
            if [ -z "$PROJECT" ] || [ -z "$NAME" ]; then
              echo "::error::give project and name, or projects"
              exit 1
            fi
            PROJECTS=$(jq -cn --arg p "$PROJECT" --arg n "$NAME" --arg a "$BUILD_ARGS" \
              '[{project: $p, name: $n, "build-args": $a}]')
          fi
          if ! jq -e 'type == "array" and length > 0 and all(.[]; (.project | type) == "string" and (.name | type) == "string")' \
            <<< "$PROJECTS" > /dev/null; then
            echo "::error::projects must be a JSON list of {\"project\", \"name\", \"build-args\"}"
            exit 1
          fi
          echo "firmware=$(jq -c 'map({project, name, "build-args": (.["build-args"] // "")})' <<< "$PROJECTS")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: next
        env:
          VERSION_COMMAND: ${{ inputs.version-command }}
        run: |
          semver='^[0-9]+\.[0-9]+\.[0-9]+$'
          tags() { git tag --list 'v*' "$@" | sed 's/^v//' | grep -E "$semver" | sort -V | tail -1; }
          next=$(tags --points-at HEAD)
          if [ -z "$next" ]; then
            last=$(tags)
            if [ -n "$last" ]; then
              IFS=. read -r major minor patch <<< "$last"
              next="$major.$minor.$((patch + 1))"
            else
              next=0.1.0
            fi
            if [ -n "$VERSION_COMMAND" ]; then
              floor=$(bash -c "$VERSION_COMMAND")
              if ! grep -qE "$semver" <<< "$floor"; then
                echo "::error::version-command printed '$floor', not X.Y.Z"
                exit 1
              fi
              [ "$(printf '%s\n%s\n' "$next" "$floor" | sort -V | tail -1)" = "$floor" ] && next=$floor
            fi
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Releasing v$next" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: version
    runs-on: ubuntu-latest
    container: espressif/idf:${{ inputs.idf-version }}
    strategy:
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
        firmware: ${{ fromJSON(needs.version.outputs.firmware) }}
    defaults:
      run:
        shell: bash
    steps:
      # The workspace belongs to the runner's user, not the container's.
      - run: git config --global --add safe.directory '*'
      # The repository and its dependencies side by side, as on a
      # developer's machine.
      - uses: actions/checkout@v5
        with:
          path: ${{ github.event.repository.name }}
      - name: Check out the dependencies
        if: inputs.dependencies != ''
        env:
          DEPENDENCIES: ${{ inputs.dependencies }}
        run: |
          for dep in $DEPENDENCIES; do
            repo=${dep%@*}
            ref=main
            [ "$repo" != "$dep" ] && ref=${dep#*@}
            dir=${repo#*/}
            git init -q "$dir"
            git -C "$dir" fetch -q --depth 1 "https://github.com/$repo" "$ref"
            git -C "$dir" checkout -q FETCH_HEAD
            echo "$repo $(git -C "$dir" rev-parse --short HEAD)"
          done
      - name: Build
        working-directory: ${{ github.event.repository.name }}/${{ matrix.firmware.project }}
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
          NAME: ${{ matrix.firmware.name }}
          BUILD_ARGS: ${{ matrix.firmware.build-args }}
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          # BUILD_ARGS is split into words on purpose.
          idf.py -B build -DPROJECT_VER="$VERSION" $BUILD_ARGS set-target "$TARGET" build
          cd build
          field() { python -c "import json; print(json.load(open('project_description.json'))['$1'])"; }
          built=$(field project_version)
          if [ "$built" != "$VERSION" ]; then
            echo "::error::the image says $built, not $VERSION (CONFIG_APP_PROJECT_VER_FROM_CONFIG?)"
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$(field app_bin)" "$GITHUB_WORKSPACE/dist/$NAME-$TARGET.bin"
          python -m esptool --chip "$TARGET" merge_bin -o "$GITHUB_WORKSPACE/dist/$NAME-$TARGET-factory.bin" @flash_args
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.firmware.name }}-${{ matrix.target }}
          path: dist/*.bin
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.bin --clobber --repo "$GITHUB_REPOSITORY"
          else
            # A push during the build moved the branch on: the newer run
            # releases. The tag couldn't be made anyway if that push changed a
            # workflow file, since the token may not create a ref whose
            # workflows differ from the branch's (403 "Resource not
            # accessible by integration").
            head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)
            if [ "$head" != "$GITHUB_SHA" ]; then
              echo "::notice::$GITHUB_REF_NAME moved on to ${head:0:7}: its own run releases, not $TAG for ${GITHUB_SHA:0:7}"
              exit 0
            fi
            gh release create "$TAG" dist/*.bin --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$TAG" --generate-notes
          fi
